<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Social Links</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="main">
    <section class="profile">
        <article class="card">
            <figure>
                <img src="images/profile-pic.svg" alt="Photo de profil" class="profile-picture">
            </figure>
            <div class="profile-info">
                <h1>Jessica Randel</h1>
                <p class="location">London, United Kingdom</p>
            </div>
            <p class="bio">"Front-end developer and avid reader."</p>
            <ul class="social-links" aria-label="Liens vers les profils sociaux">
                <li><a href="https://www.github.com/votreprofil" target="_blank" aria-label="Visiter mon profil GitHub" rel="noopener noreferrer">GitHub</a></li>
                <li><a href="https://www.frontendmentor.io/profile/votreprofil" target="_blank" aria-label="Visiter mon profil Frontend Mentor" rel="noopener noreferrer">Frontend Mentor</a></li>
                <li><a href="https://www.linkedin.com/in/votreprofil" target="_blank" aria-label="Visiter mon profil LinkedIn" rel="noopener noreferrer">LinkedIn</a></li>
                <li><a href="https://www.twitter.com/votreprofil" target="_blank" aria-label="Visiter mon profil Twitter" rel="noopener noreferrer">Twitter</a></li>
                <li><a href="https://www.instagram.com/votreprofil" target="_blank" aria-label="Visiter mon profil Instagram" rel="noopener noreferrer">Instagram</a></li>
            </ul>
        </article>
    </section> 
</body>
</html>
